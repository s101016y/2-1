<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>경량 마크다운 에디터</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "맑은 고딕", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  /* 상단 툴바 */
  #toolbar { display: flex; gap: 4px; padding: 8px; background: #2d2d2d; flex-wrap: wrap; }
  #toolbar button { background: #444; color: #eee; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  #toolbar button:hover { background: #666; }
  #toolbar .sep { width: 1px; background: #666; margin: 0 6px; }
  /* 좌우 2단 분할 */
  #container { flex: 1; display: flex; min-height: 0; }
  #editor, #preview { width: 50%; height: 100%; overflow-y: auto; }
  #editor { border: none; padding: 16px; font-family: "D2Coding", Consolas, monospace; font-size: 15px; line-height: 1.6; resize: none; outline: none; border-right: 1px solid #ccc; }
  #preview { padding: 16px; line-height: 1.6; }
  /* 미리보기 스타일 */
  #preview h1 { border-bottom: 2px solid #eee; padding-bottom: 4px; }
  #preview h2 { border-bottom: 1px solid #eee; padding-bottom: 3px; }
  #preview blockquote { border-left: 4px solid #ccc; margin: 0; padding: 0 12px; color: #666; }
  #preview code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-family: Consolas, monospace; }
  #preview table { border-collapse: collapse; }
  #preview th, #preview td { border: 1px solid #ccc; padding: 4px 10px; }
  #preview img { max-width: 100%; }
</style>
</head>
<body>

<div id="toolbar">
  <button data-md="h1">H1</button>
  <button data-md="h2">H2</button>
  <button data-md="bold">굵게</button>
  <button data-md="italic">기울임</button>
  <button data-md="strike">취소선</button>
  <button data-md="quote">인용구</button>
  <button data-md="list">목록</button>
  <button data-md="code">코드</button>
  <span class="sep"></span>
  <button id="btnLoad">파일 불러오기</button>
  <button id="btnSave">파일 저장</button>
  <button id="btnCopy">본문 복사</button>
  <input type="file" id="fileInput" accept=".md,.txt" style="display:none">
</div>

<div id="container">
  <textarea id="editor" placeholder="여기에 마크다운을 입력하세요..."></textarea>
  <div id="preview"></div>
</div>

<script>
(function () {
  "use strict";

  const editor  = document.getElementById("editor");
  const preview = document.getElementById("preview");
  const STORAGE_KEY = "markdown-editor-content";

  /* ---------- HTML 특수문자 이스케이프 (XSS/깨짐 방지) ---------- */
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
  }

  /* ---------- 인라인 문법 변환 (한 줄 내부용) ---------- */
  function parseInline(text) {
    // 이미지: ![설명](URL)  — 링크보다 먼저 처리해야 함
    text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    // 링크: [텍스트](URL)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    // 굵게: **텍스트**  (기울임보다 먼저)
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // 기울임: *텍스트*
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    // 취소선: ~~텍스트~~
    text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // 인라인 코드: `텍스트`
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    return text;
  }

  /* ---------- 표 파싱 (추가 기능) ---------- */
  function parseTable(lines, start) {
    const headerLine = lines[start];
    const sepLine    = lines[start + 1];
    // 2번째 줄이 구분선(---)인지 확인
    if (!/^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(sepLine || "")) {
      return null;
    }
    const splitRow = (line) =>
      line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());

    let html = "<table><thead><tr>";
    splitRow(headerLine).forEach(c => { html += "<th>" + parseInline(c) + "</th>"; });
    html += "</tr></thead><tbody>";

    let i = start + 2;
    for (; i < lines.length; i++) {
      if (lines[i].indexOf("|") === -1) break;
      html += "<tr>";
      splitRow(lines[i]).forEach(c => { html += "<td>" + parseInline(c) + "</td>"; });
      html += "</tr>";
    }
    html += "</tbody></table>";
    return { html: html, next: i };
  }

  /* ---------- 전체 마크다운 → HTML 변환 ---------- */
  function parseMarkdown(src) {
    const lines = escapeHtml(src).split("\n");
    let html = "";
    let inList = false;

    function closeList() {
      if (inList) { html += "</ul>"; inList = false; }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // 표 감지
      if (line.indexOf("|") !== -1) {
        const tbl = parseTable(lines, i);
        if (tbl) {
          closeList();
          html += tbl.html;
          i = tbl.next - 1;
          continue;
        }
      }

      // 제목 H1 / H2
      if (/^## /.test(line)) {
        closeList();
        html += "<h2>" + parseInline(line.slice(3)) + "</h2>";
        continue;
      }
      if (/^# /.test(line)) {
        closeList();
        html += "<h1>" + parseInline(line.slice(2)) + "</h1>";
        continue;
      }
      // 인용구
      if (/^> /.test(line)) {
        closeList();
        html += "<blockquote>" + parseInline(line.slice(2)) + "</blockquote>";
        continue;
      }
      // 목록
      if (/^- /.test(line)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + parseInline(line.slice(2)) + "</li>";
        continue;
      }
      // 일반 줄
      closeList();
      if (line === "") {
        html += "<br>";
      } else {
        html += parseInline(line) + "<br>";
      }
    }
    closeList();
    return html;
  }

  /* ---------- 미리보기 갱신 + 자동 저장 ---------- */
  function update() {
    preview.innerHTML = parseMarkdown(editor.value);
    localStorage.setItem(STORAGE_KEY, editor.value);
  }
  editor.addEventListener("input", update);

  /* ---------- 툴바 서식 버튼: 선택 영역 Wrap / 커서 삽입 ---------- */
  const SYNTAX = {
    h1:     { prefix: "# ",  suffix: "" },
    h2:     { prefix: "## ", suffix: "" },
    bold:   { prefix: "**",  suffix: "**" },
    italic: { prefix: "*",   suffix: "*" },
    strike: { prefix: "~~",  suffix: "~~" },
    quote:  { prefix: "> ",  suffix: "" },
    list:   { prefix: "- ",  suffix: "" },
    code:   { prefix: "`",   suffix: "`" }
  };

  function applyFormat(type) {
    const s = SYNTAX[type];
    const start = editor.selectionStart;
    const end   = editor.selectionEnd;
    const val   = editor.value;
    const selected = val.slice(start, end);

    const inserted = s.prefix + selected + s.suffix;
    editor.value = val.slice(0, start) + inserted + val.slice(end);

    editor.focus();
    editor.setSelectionRange(start + s.prefix.length, start + s.prefix.length + selected.length);

    update();
  }

  document.querySelectorAll("#toolbar button[data-md]").forEach(btn => {
    btn.addEventListener("click", () => applyFormat(btn.dataset.md));
  });

  /* ---------- 파일 불러오기 (.md / .txt) ---------- */
  const fileInput = document.getElementById("fileInput");
  document.getElementById("btnLoad").addEventListener("click", () => {
    fileInput.value = "";
    fileInput.click();
  });
  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (editor.value.trim() !== "" &&
        !confirm("작성 중인 내용이 대체됩니다. 계속하시겠습니까?")) {
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      editor.value = ev.target.result;
      update();
    };
    reader.readAsText(file, "UTF-8");
  });

  /* ---------- 파일 저장 (.md 다운로드) ---------- */
  document.getElementById("btnSave").addEventListener("click", () => {
    let name = prompt("저장할 파일 이름을 입력하세요.", "document");
    if (name === null) return;
    if (name.trim() === "") name = "document";
    if (!/\.md$/i.test(name)) name += ".md";

    const blob = new Blob([editor.value], { type: "text/markdown;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
    URL.revokeObjectURL(url);
  });

  /* ---------- 본문 복사 ---------- */
  document.getElementById("btnCopy").addEventListener("click", () => {
    navigator.clipboard.writeText(editor.value)
      .then(() => alert("클립보드에 복사되었습니다."))
      .catch(() => {
        // clipboard API 실패 시 대체 방식
        editor.select();
        document.execCommand("copy");
        alert("클립보드에 복사되었습니다.");
      });
  });

  /* ---------- 스크롤 동기화 (추가 기능) ---------- */
  editor.addEventListener("scroll", () => {
    const ratio = editor.scrollTop / (editor.scrollHeight - editor.clientHeight || 1);
    preview.scrollTop = ratio * (preview.scrollHeight - preview.clientHeight);
  });

  /* ----------
